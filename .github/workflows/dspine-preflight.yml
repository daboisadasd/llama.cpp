name: DSpine checkpoint and code-bridge preflight
on:
  push:
    paths:
      - 'tools/dspine/**'
      - 'tools/phase1_mtp/inspect_gguf.py'
      - 'tools/phase1_mtp/test_phase1.py'
      - '.github/workflows/dspine-preflight.yml'
  pull_request:
    paths:
      - 'tools/dspine/**'
      - 'tools/phase1_mtp/inspect_gguf.py'
      - 'tools/phase1_mtp/test_phase1.py'
      - '.github/workflows/dspine-preflight.yml'

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: DSpine checkpoint/header and bridge math tests
        run: python -m unittest discover -s tools/dspine -p 'test_*.py' -v
      - name: Existing DFlash and DSpark native seams
        run: python tools/dspine/source_audit.py --llama-root .
      - name: Native GGML adjacent-code bridge CPU graph
        run: |
          cmake -S tools/dspine -B build-dspine-bridge -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build-dspine-bridge --target test-dspine-bridge test-dspine-refine test-dspine-tail test-dspine-tables test-dspine-gguf-names test-dspine-bridge-bf16 --parallel 3
          ctest --test-dir build-dspine-bridge --output-on-failure
      - name: Build real-weight GGML RPC bridge harness (compile only)
        run: |
          cmake -S tools/dspine -B build-dspine-rpc -DDSPINE_BRIDGE_RPC=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dspine-rpc --target test-dspine-rpc-bridge --parallel 3

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every DSpine PowerShell entrypoint before running it
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -LiteralPath tools/dspine -Filter *.ps1 -File)
          if ($scripts.Count -eq 0) { throw 'No DSpine PowerShell scripts found' }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parse failed: $($script.FullName)"
            }
            Write-Host "PowerShell syntax PASS: $($script.Name)"
          }
